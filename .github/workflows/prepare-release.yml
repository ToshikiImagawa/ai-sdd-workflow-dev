name: Prepare Release

# 【実行手順】Actions > Prepare Release の "Run workflow" では、必ず Branch に
# develop を選んで dispatch すること。
#
# workflow_dispatch は「選択した ref に存在するワークフロー定義」を実行する。
# 既定ブランチ（main）を選ぶと main 側の古い定義が動くため、下の
# "Check version consistency on develop" のような後から追加された事前検証が
# まるごとスキップされる。事前検証を含むこの定義が main に載るのは、
# この定義自体を含むリリースが main にマージされた後である。
#
# このワークフローが検証・PR 元にするブランチは develop に固定してある
# （checkout の ref と各ステップの git checkout develop）。dispatch ref が
# develop でなければ "Verify dispatch ref" ステップで停止する。

on:
  workflow_dispatch:
    inputs:
      version:
        description: "バージョン（v プレフィックス不要。例: 1.2.3）。Branch には develop を選択すること"
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      # dispatch ref が develop 以外なら、ここで動いている定義自体が develop の
      # ものではない可能性がある（= 事前検証が抜けた古い定義かもしれない）。
      # 先頭で止めて、develop を選び直させる。
      - name: Verify dispatch ref
        env:
          DISPATCH_REF: ${{ github.ref_name }}
        run: |
          if [ "$DISPATCH_REF" != "develop" ]; then
            echo "::error::このワークフローは develop ブランチを選択して実行してください（今回の dispatch ref: $DISPATCH_REF）。workflow_dispatch は選択した ref のワークフロー定義を実行するため、別ブランチから起動すると事前検証ステップが静かにスキップされることがあります。"
            exit 1
          fi
          echo "Dispatch ref: $DISPATCH_REF"

      # 検証対象・PR 元をブランチ名で固定する。fetch-depth: 0 で main も取得され、
      # 後続ステップの git checkout develop / git pull origin develop が使える。
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Validate version format
        id: validate
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-.+)?$ ]]; then
            echo "::error::Invalid version format: $VERSION. Expected semver (e.g., 1.2.3 or 1.2.3-alpha)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check version consistency on develop
        run: |
          VERSION="${{ steps.validate.outputs.version }}"

          # release ブランチは develop から切るため、照合対象も develop の内容に揃える
          git checkout develop
          git pull origin develop

          ERRORS=()

          # 1. marketplace.json metadata.version
          MARKET_VER=$(jq -r '.metadata.version' .claude-plugin/marketplace.json)
          if [ "$MARKET_VER" != "$VERSION" ]; then
            ERRORS+=("marketplace.json metadata.version: expected $VERSION, got $MARKET_VER")
          fi

          # 2. marketplace.json plugins[].version (all entries)
          PLUGIN_VERS=$(jq -r '.plugins[].version' .claude-plugin/marketplace.json)
          INDEX=0
          while IFS= read -r ver; do
            if [ "$ver" != "$VERSION" ]; then
              ERRORS+=("marketplace.json plugins[$INDEX].version: expected $VERSION, got $ver")
            fi
            INDEX=$((INDEX + 1))
          done <<< "$PLUGIN_VERS"

          # 3. sdd-workflow plugin.json
          SDD_VER=$(jq -r '.version' plugins/sdd-workflow/.claude-plugin/plugin.json)
          if [ "$SDD_VER" != "$VERSION" ]; then
            ERRORS+=("sdd-workflow plugin.json version: expected $VERSION, got $SDD_VER")
          fi

          # 4. CHANGELOG 見出し（release.yml のリリースノート抽出がこの見出しに依存する）
          VERSION_RE="${VERSION//./\\.}"
          for CHANGELOG in plugins/sdd-workflow/CHANGELOG.md plugins/sdd-workflow/CHANGELOG.ja.md; do
            if ! grep -qE "^## \[$VERSION_RE\]" "$CHANGELOG"; then
              ERRORS+=("$CHANGELOG: heading '## [$VERSION]' not found")
            fi
          done

          if [ ${#ERRORS[@]} -gt 0 ]; then
            echo "::error::Version mismatch detected between input v$VERSION and develop contents:"
            for err in "${ERRORS[@]}"; do
              echo "  - $err"
            done
            echo "::error::marketplace.json / plugin.json のバージョン照合は release.yml のタグ push 時にも再実行されるため、不一致のまま進めても merge 後のタグ push で失敗します。CHANGELOG については release.yml は CHANGELOG.md から抽出したリリースノートが空でないかだけを見る（CHANGELOG.ja.md は参照しない）ので、両言語の見出しを保証するのはこの照合だけです。develop 側を prepare-release スキルで更新してから再実行してください。"
            exit 1
          fi

          echo "All version checks passed: $VERSION"

      - name: Create PR from dev to main
        id: create-pr
        run: |
          VERSION="${{ steps.validate.outputs.version }}"
          BRANCH="release/v$VERSION"

          # dev から新しい release ブランチを作成
          git checkout develop
          git pull origin develop
          git checkout -b "$BRANCH"

          # gh pr create は origin 上のブランチを参照するため、先に push する
          git push -u origin "$BRANCH"

          # PR 作成（draft ではなく通常の PR）。gh pr create の標準出力は
          # "https://.../pull/123" という素のURLで "#" を含まないため、そこから
          # 番号を抽出しようとすると常に空文字列になる。作成後に head branch で
          # 引き直す方が、出力フォーマット変化にも強い
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Release: v$VERSION" \
            --body "## Version
          v$VERSION

          ---

          Automated merge from develop to main by \`prepare-release\` workflow.

          Triggered by @${{ github.actor }}"

          PR_NUMBER=$(gh pr view --repo "${{ github.repository }}" "$BRANCH" --json number --jq '.number')
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "PR created: #$PR_NUMBER"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for CI checks
        id: wait-ci
        run: |
          VERSION="${{ steps.validate.outputs.version }}"
          PR_NUMBER="${{ steps.create-pr.outputs.pr_number }}"
          TIMEOUT=600  # 10 minutes
          ELAPSED=0

          echo "Waiting for CI checks on PR #$PR_NUMBER..."

          while [ $ELAPSED -lt $TIMEOUT ]; do
            # Check PR status
            STATUS=$(gh pr view "$PR_NUMBER" --json commits,reviews,statusCheckRollup --jq '.statusCheckRollup | map(.state) | unique | join(",")')

            # SUCCESS or FAILURE
            if [[ "$STATUS" =~ "FAILURE" ]]; then
              echo "::error::CI checks failed on PR #$PR_NUMBER"
              exit 1
            fi

            if [[ ! "$STATUS" =~ "PENDING" ]] && [[ ! "$STATUS" =~ "IN_PROGRESS" ]]; then
              echo "CI checks completed: $STATUS"
              break
            fi

            echo "CI in progress... ($ELAPSED/$TIMEOUT seconds)"
            sleep 10
            ELAPSED=$((ELAPSED + 10))
          done

          if [ $ELAPSED -ge $TIMEOUT ]; then
            echo "::error::CI checks timeout on PR #$PR_NUMBER"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge PR
        run: |
          PR_NUMBER="${{ steps.create-pr.outputs.pr_number }}"

          echo "Merging PR #$PR_NUMBER with merge commit strategy..."
          # 直前の Wait for CI checks で CI 成功を確認済みのため auto-merge は使わず直接 merge する。
          # develop -> main は長命ブランチ統合のため squash ではなくマージコミットを使い、
          # main と develop の履歴を共有させて分岐・back-merge を防ぐ。
          gh pr merge "$PR_NUMBER" \
            --merge \
            --delete-branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for merge to complete
        run: |
          PR_NUMBER="${{ steps.create-pr.outputs.pr_number }}"
          TIMEOUT=60
          ELAPSED=0
          STATE="UNKNOWN"

          while [ $ELAPSED -lt $TIMEOUT ]; do
            # --jq は --json と併用しないと gh がエラーになる（結果を常に UNKNOWN に
            # してしまい、この待機が空回りする）ため、--json state を必ず付ける。
            STATE=$(gh pr view "$PR_NUMBER" --json state --jq '.state' 2>/dev/null || echo "UNKNOWN")
            if [ "$STATE" = "MERGED" ]; then
              echo "PR #$PR_NUMBER merged successfully"
              break
            fi

            echo "Waiting for merge... state=$STATE ($ELAPSED/$TIMEOUT seconds)"
            sleep 2
            ELAPSED=$((ELAPSED + 2))
          done

          if [ "$STATE" != "MERGED" ]; then
            echo "::error::PR #$PR_NUMBER did not reach MERGED within ${TIMEOUT}s (last state: $STATE)"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create deployment notification
        if: success()
        run: |
          VERSION="${{ steps.validate.outputs.version }}"
          PR_NUMBER="${{ steps.create-pr.outputs.pr_number }}"
          echo "✅ develop -> main のマージが完了しました (PR #$PR_NUMBER)"
          echo ""
          echo "📌 次の手動作業が必要です:"
          echo "  リリースを公開するには、最新の main にタグを打って push してください。"
          echo "  GITHUB_TOKEN で push したタグは release.yml をトリガーしないため、この作業は人間が行います。"
          echo ""
          echo "    git checkout main"
          echo "    git pull origin main"
          echo "    git tag v$VERSION"
          echo "    git push origin v$VERSION"
          echo ""
          echo "  タグ push により release.yml が起動し、公開リポへの配布とリリース作成が実行されます。"
