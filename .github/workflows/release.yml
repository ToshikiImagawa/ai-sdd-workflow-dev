name: Release

on:
  push:
    tags:
      - "v*"

# 既定は読み取りのみ。dev リポへの Release 作成が必要な publish ジョブだけ contents: write に上げる。
# 公開リポ（配布カタログ）への書き込みは PUBLIC_REPO_TOKEN が担う
permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PUBLIC_REPO: ToshikiImagawa/ai-sdd-workflow
      PLUGIN_NAME: sdd-workflow
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Check version consistency
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ERRORS=()

          # 1. marketplace.json metadata.version
          MARKET_VER=$(jq -r '.metadata.version' .claude-plugin/marketplace.json)
          if [ "$MARKET_VER" != "$VERSION" ]; then
            ERRORS+=("marketplace.json metadata.version: expected $VERSION, got $MARKET_VER")
          fi

          # 2. marketplace.json plugins[].version (all entries)
          PLUGIN_VERS=$(jq -r '.plugins[].version' .claude-plugin/marketplace.json)
          INDEX=0
          while IFS= read -r ver; do
            if [ "$ver" != "$VERSION" ]; then
              ERRORS+=("marketplace.json plugins[$INDEX].version: expected $VERSION, got $ver")
            fi
            INDEX=$((INDEX + 1))
          done <<< "$PLUGIN_VERS"

          # 3. sdd-workflow plugin.json
          SDD_VER=$(jq -r '.version' plugins/sdd-workflow/.claude-plugin/plugin.json)
          if [ "$SDD_VER" != "$VERSION" ]; then
            ERRORS+=("sdd-workflow plugin.json version: expected $VERSION, got $SDD_VER")
          fi

          if [ ${#ERRORS[@]} -gt 0 ]; then
            echo "::error::Version mismatch detected between tag v$VERSION and manifest files:"
            for err in "${ERRORS[@]}"; do
              echo "  - $err"
            done
            exit 1
          fi

          echo "All version checks passed: $VERSION"

      - name: Extract release notes from CHANGELOG
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          CHANGELOG="plugins/sdd-workflow/CHANGELOG.md"

          awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) exit
              if ($0 ~ "\\[" ver "\\]") found=1
              next
            }
            found { print }
          ' "$CHANGELOG" > /tmp/release-notes.md

          if [ ! -s /tmp/release-notes.md ]; then
            echo "::error::No CHANGELOG entry found for version $VERSION in $CHANGELOG"
            exit 1
          fi

      - name: Determine prerelease
        id: prerelease
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if [[ "$VERSION" == *-* ]]; then
            echo "flag=--prerelease" >> "$GITHUB_OUTPUT"
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build distribution archive
        id: archive
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SHA256=$(bash scripts/build-plugin-archive.sh "$VERSION" dist)
          if ! [[ "$SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::build-plugin-archive.sh did not print a sha256 (got: $SHA256)"
            exit 1
          fi
          {
            echo "zip=dist/${PLUGIN_NAME}-${VERSION}.zip"
            echo "sha256=$SHA256"
            echo "url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${PLUGIN_NAME}-${VERSION}.zip"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release on dev repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ZIP="${{ steps.archive.outputs.zip }}"
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file /tmp/release-notes.md \
            ${{ steps.prerelease.outputs.flag }} \
            "$ZIP" "$ZIP.sha256"

      - name: Verify published archive
        run: |
          # 公開リポのカタログが指す URL から実際に取得でき、sha256 が一致することを確かめる
          EXPECTED="${{ steps.archive.outputs.sha256 }}"
          ACTUAL=$(curl -fsSL --retry 5 --retry-delay 5 "${{ steps.archive.outputs.url }}" | sha256sum | cut -d' ' -f1)
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Downloaded archive sha256 $ACTUAL does not match $EXPECTED"
            exit 1
          fi

      - name: Clone public repo
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${PUBLIC_REPO}.git" public

      - name: Update distribution catalog
        working-directory: public
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          CATALOG=.claude-plugin/marketplace.json

          CURRENT=$(jq -r --arg name "$PLUGIN_NAME" '.plugins[] | select(.name == $name) | .version' "$CATALOG")
          if [ -z "$CURRENT" ]; then
            echo "::error::Plugin entry \"$PLUGIN_NAME\" not found in $PUBLIC_REPO/$CATALOG"
            exit 1
          fi
          if [ "$CURRENT" = "$VERSION" ]; then
            echo "::error::$PUBLIC_REPO already points $PLUGIN_NAME at $VERSION. Refusing to open a duplicate catalog PR."
            exit 1
          fi

          jq --arg version "$VERSION" \
             --arg name "$PLUGIN_NAME" \
             --arg url "${{ steps.archive.outputs.url }}" \
             --arg sha256 "${{ steps.archive.outputs.sha256 }}" \
             '.metadata.version = $version
              | .plugins |= map(
                  if .name == $name then
                    .version = $version
                    | .source = {source: "archive", url: $url, sha256: $sha256}
                  else . end)' \
             "$CATALOG" > "$CATALOG.tmp"
          mv "$CATALOG.tmp" "$CATALOG"
          git --no-pager diff

      - name: Open catalog PR on public repo
        working-directory: public
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          BRANCH="release/${GITHUB_REF_NAME}"
          URL="${{ steps.archive.outputs.url }}"
          SHA256="${{ steps.archive.outputs.sha256 }}"
          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then
            echo "::error::Branch $BRANCH already exists on $PUBLIC_REPO. Close the previous PR and delete the branch before re-running."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add .claude-plugin/marketplace.json
          git commit -m "[release] ${PLUGIN_NAME} ${GITHUB_REF_NAME} を配布カタログに反映"
          git push origin "$BRANCH"

          cat > /tmp/catalog-pr-body.md <<EOF
          \`${PLUGIN_NAME}\` を \`${GITHUB_REF_NAME}\` に更新します。

          - source: \`archive\`
          - url: ${URL}
          - sha256: \`${SHA256}\`
          - Release: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}

          この PR は ${GITHUB_REPOSITORY} の release.yml が自動作成しました。
          EOF
          gh pr create \
            --repo "$PUBLIC_REPO" \
            --base main \
            --head "$BRANCH" \
            --title "[release] ${PLUGIN_NAME} ${GITHUB_REF_NAME}" \
            --body-file /tmp/catalog-pr-body.md
